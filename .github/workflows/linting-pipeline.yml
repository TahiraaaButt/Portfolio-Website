name: Linting Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # Set up Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'  # Specify the Node.js version you want

    # Install dependencies (HTMLHint and Stylelint)
    - name: Install dependencies
      run: |
        npm install htmlhint stylelint --save-dev

    # Lint HTML files
    - name: Lint HTML files
      run: npx htmlhint src/**/*.html

    # Lint CSS files
    - name: Lint CSS files
      run: npx stylelint styles/**/*.css

    # Optional: Upload linting results
    - name: Upload linting results as artifacts
      uses: actions/upload-artifact@v3
      with:
        name: linting-results
        path: linting-results.log
